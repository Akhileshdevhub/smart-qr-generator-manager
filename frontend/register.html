<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Smart QR Manager</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card auth-card">
      <a href="/" class="brand"><span class="dot"></span> Smart QR Manager</a>
      <h2 style="text-align:center; font-size:20px;">Create your account</h2>
      <div id="err"></div>
      <form id="regForm">
        <div class="field">
          <label for="name">Display name <span class="hint" style="display:inline;">(optional)</span></label>
          <input type="text" id="name" autocomplete="name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password">
          <div class="hint">At least 8 characters.</div>
        </div>
        <button class="btn" type="submit" style="width:100%;">Create account</button>
      </form>
      <p class="muted" style="text-align:center; margin-top:16px;">
        Already have an account? <a href="/login">Log in</a>
      </p>
    </div>
  </div>
  <script src="/static/js/api.js"></script>
  <script>
    if (Auth.isLoggedIn()) location.href = "/app";
    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err"); err.innerHTML = "";
      try {
        await api("/api/auth/register", { auth: false, method: "POST", body: {
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          display_name: document.getElementById("name").value,
        }});
        // Auto-login after registering.
        const data = await api("/api/auth/login", { auth: false, method: "POST", body: {
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }});
        Auth.set(data.access_token);
        location.href = "/app";
      } catch (ex) {
        err.innerHTML = `<div class="alert err">${escapeHtml(ex.message)}</div>`;
      }
    });
  </script>
</body>
</html>
